[project]
name = "openarm-smolvla-client"
version = "0.1.0"
description = "openarm_act policy that asks an openarm_smolvla server for SmolVLA action chunks"
# ROS 2 Humble's /usr/bin/python3.
requires-python = ">=3.10"
dependencies = [
    # cv_bridge on Humble is built against numpy 1; the server's Python 3.12 has numpy 2.
    "numpy>=1.22,<2; python_version < '3.11'",
    "numpy>=1.22; python_version >= '3.11'",
    "msgpack>=1.0",
    "websockets>=11",   # websockets.sync
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openarm_smolvla_client"]
