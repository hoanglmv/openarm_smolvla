[project]
name = "openarm-smolvla"
version = "0.1.0"
description = "Fine-tune SmolVLA (LeRobot) on OpenArm bimanual teleop data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The model, the dataset format, training: LeRobot, one exact release.
    # Its dataset format and processor API change between minor versions.
    "lerobot[smolvla,dataset,training]==0.6.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    # Reading the HDF5 episodes openarm_mc's recorder writes: it writes with
    # HDF5 2.0, which older h5py (HDF5 1.14) cannot read.
    "h5py>=3.16",
    "pyyaml>=6.0",
    # Serving: openpi's websocket + msgpack protocol, as openarm_pizero serves.
    "websockets>=13",
    "msgpack>=1.0",
    # The robot-side client; the server shares its msgpack encoding.
    "openarm-smolvla-client",
]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[tool.uv.sources]
openarm-smolvla-client = { path = "client", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openarm_smolvla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests save models of ~1 GB; keep their directories only when they fail.
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["client"]
