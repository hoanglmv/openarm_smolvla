# OpenArm with ACT's inputs: chest RGB and chest depth (+ qpos).
# SmolVLA has no depth encoder, so depth goes in as a second, gray image,
# scaled as ACT scales it (0.2..1.2 m -> 0..1). The base model has never seen
# such an image: compare against data=openarm.
defaults:
  - openarm
  - _self_

name: openarm_rgbd
cameras: [chest, chest_depth]
