<svg width="940" height="172" viewBox="0 0 940 172" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 Z" fill="#000000" />
    </marker>
  </defs>

  <!-- Background: Solid White -->
  <rect x="0" y="0" width="940" height="172" fill="#ffffff"/>

  <!-- Global Styles -->
  <style>
    .box {
      fill: #ffffff;
      stroke: #000000;
      stroke-width: 1.75px;
      rx: 6px;
      ry: 6px;
    }
    .arrow {
      stroke: #000000;
      stroke-width: 1.75px;
      fill: none;
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      fill: #000000;
      text-anchor: middle;
      dominant-baseline: central;
      letter-spacing: -0.15px;
    }
  </style>

  <!-- ==================== ROW 1 (Left to Right) ==================== -->
  <!-- 1. HF dataset (HDF5): x=24, w=150 -> right=174 -->
  <rect x="24" y="24" width="150" height="44" class="box"/>
  <text x="99" y="46">HF dataset (HDF5)</text>

  <!-- Arrow 1 -> 2: 174 to 200 (len 26) -->
  <line x1="174" y1="46" x2="200" y2="46" class="arrow" marker-end="url(#arrow)"/>

  <!-- 2. LeRobot dataset: x=202, w=134 -> right=336 -->
  <rect x="202" y="24" width="134" height="44" class="box"/>
  <text x="269" y="46">LeRobot dataset</text>

  <!-- Arrow 2 -> 3: 336 to 362 (len 26) -->
  <line x1="336" y1="46" x2="362" y2="46" class="arrow" marker-end="url(#arrow)"/>

  <!-- 3. norm stats: x=364, w=106 -> right=470 -->
  <rect x="364" y="24" width="106" height="44" class="box"/>
  <text x="417" y="46">norm stats</text>

  <!-- Arrow 3 -> 4: 470 to 496 (len 26) -->
  <line x1="470" y1="46" x2="496" y2="46" class="arrow" marker-end="url(#arrow)"/>

  <!-- 4. SmolVLA training: x=498, w=146 -> right=644 -->
  <rect x="498" y="24" width="146" height="44" class="box"/>
  <text x="571" y="46">SmolVLA training</text>

  <!-- Arrow 4 -> 5: 644 to 670 (len 26) -->
  <line x1="644" y1="46" x2="670" y2="46" class="arrow" marker-end="url(#arrow)"/>

  <!-- 5. checkpoint: x=672, w=112 -> right=784 -->
  <rect x="672" y="24" width="112" height="44" class="box"/>
  <text x="728" y="46">checkpoint</text>

  <!-- Arrow 5 -> 6: 784 to 810 (len 26) -->
  <line x1="784" y1="46" x2="810" y2="46" class="arrow" marker-end="url(#arrow)"/>

  <!-- 6. release: x=812, w=104 -> right=916. Center = 864 -->
  <rect x="812" y="24" width="104" height="44" class="box"/>
  <text x="864" y="46">release</text>

  <!-- ==================== TRANSITION: release -> serve (GPU) ==================== -->
  <line x1="864" y1="68" x2="864" y2="102" class="arrow" marker-end="url(#arrow)"/>

  <!-- ==================== ROW 2 (Right to Left) ==================== -->
  <!-- 7. serve (GPU): x=812, w=104 -> right=916. Center = 864 -->
  <rect x="812" y="104" width="104" height="44" class="box"/>
  <text x="864" y="126">serve (GPU)</text>

  <!-- Arrow serve -> client: 812 to 764 (len 48, pointing left) -->
  <line x1="812" y1="126" x2="764" y2="126" class="arrow" marker-end="url(#arrow)"/>

  <!-- 8. SmolVLAPolicy client: x=576, w=186 -> right=762. Center = 669 -->
  <rect x="576" y="104" width="186" height="44" class="box"/>
  <text x="669" y="126">SmolVLAPolicy client</text>

  <!-- Arrow client -> websocket: 576 to 528 (len 48, pointing left) -->
  <line x1="576" y1="126" x2="528" y2="126" class="arrow" marker-end="url(#arrow)"/>

  <!-- 9. websocket: x=412, w=114 -> right=526. Center = 469 -->
  <rect x="412" y="104" width="114" height="44" class="box"/>
  <text x="469" y="126">websocket</text>

  <!-- Arrow websocket -> [50, 16]: 412 to 364 (len 48, pointing left) -->
  <line x1="412" y1="126" x2="364" y2="126" class="arrow" marker-end="url(#arrow)"/>

  <!-- 10. [50, 16] joint targets: x=168, w=194 -> right=362. Center = 265 -->
  <rect x="168" y="104" width="194" height="44" class="box"/>
  <text x="265" y="126">[50, 16] joint targets</text>

  <!-- Arrow [50, 16] -> robot: 168 to 120 (len 48, pointing left) -->
  <line x1="168" y1="126" x2="120" y2="126" class="arrow" marker-end="url(#arrow)"/>

  <!-- 11. robot: x=24, w=94 -> right=118. Center = 71 -->
  <rect x="24" y="104" width="94" height="44" class="box"/>
  <text x="71" y="126">robot</text>
</svg>
